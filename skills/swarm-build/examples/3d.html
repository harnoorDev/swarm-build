<!-- 3 · The engine, a crew of twelve, and a Three.js world that follows swarm:scene progress. -->
<script type="module">
  import { swarmBuild } from '../assets/swarm-build.js';

  const CORAL = '#ff5b3a', CREAM = '#fff6e8', INK = '#16181d';
  const crew = {
    renderer: '#b49bff', conductor: CORAL, tracklayer: INK, terraformer: CREAM, gardener: CORAL, painter: INK,
    carpenter: CREAM, rigger: CORAL, mason: INK, shipwright: CREAM, cloudsmith: CORAL, lamplighter: INK,
  };
  const DUR = 20;   // seconds, as in data-swarm-duration
  const swarm = swarmBuild({ once: 'always', crew, trace: false, sceneTimeout: 8 });
  const canvas = document.getElementById('world'), marks = document.getElementById('marks');
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelector('.again').addEventListener('click', () => swarm.replay());

  // Build progress 0 → 1 comes from the crew; with no build (reduced motion, effect off) the world is finished.
  let build = root.classList.contains('swarm-js') ? 0 : 1, heard = false, clock = 0, readyAt = null;
  canvas.addEventListener('swarm:scene', (e) => {
    heard = true; build = e.detail.progress;
    if (build < 1) readyAt = null; else if (readyAt === null) readyAt = clock;
  });

  // ------------------------------------------------------------------ small maths
  const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const sm = (e0, e1, x) => { const t = cl((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixv = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  let seed = 20261106;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const rr = (a, b) => a + (b - a) * rnd();
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const h2 = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
  function noise(x, z) {
    const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi, u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
    return lerp(lerp(h2(xi, zi), h2(xi + 1, zi), u), lerp(h2(xi, zi + 1), h2(xi + 1, zi + 1), u), v);
  }
  const fbm = (x, z) => noise(x, z) * 0.5 + noise(x * 2.03 + 5, z * 2.03) * 0.25 + noise(x * 4.1, z * 4.1 + 3) * 0.125 + noise(x * 8.3 + 1, z * 8.3) * 0.0625;

  // ------------------------------------------------------------------ the line: a Catmull-Rom curve, sampled
  const CP = [
    [-24, 1.2, 198], [-12, 1.3, 168], [2, 1.4, 142], [-9, 1.6, 116], [6, 1.6, 92], [18, 1.8, 68],          // fields and windmills
    [25, 2.0, 46], [27, 2.2, 22], [22, 2.6, 0],                                             // along the harbour
    [8, 5, -18], [-14, 9.5, -32], [-20, 14.5, -52], [-4, 20.5, -66], [16, 26.5, -80],       // the climb
    [12, 32.5, -100], [-6, 37.5, -112], [-14, 41.5, -128], [-6, 43.5, -144],                // to the summit station
  ];
  const PS = [];
  for (let i = 0; i < CP.length - 1; i++) {
    const p0 = CP[Math.max(0, i - 1)], p1 = CP[i], p2 = CP[i + 1], p3 = CP[Math.min(CP.length - 1, i + 2)];
    for (let k = 0; k < 60; k++) {
      const t = k / 60, t2 = t * t, t3 = t2 * t;
      PS.push(p1.map((_, j) => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
    }
  }
  PS.push(CP[CP.length - 1]);
  const SL = [0];
  for (let i = 1; i < PS.length; i++) SL.push(SL[i - 1] + Math.hypot(PS[i][0] - PS[i - 1][0], PS[i][1] - PS[i - 1][1], PS[i][2] - PS[i - 1][2]));
  const LEN = SL[SL.length - 1];
  function pathAt(s) {
    s = cl(s, 0, LEN);
    let lo = 0, hi = SL.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (SL[m] <= s) lo = m; else hi = m; }
    const t = (s - SL[lo]) / (SL[hi] - SL[lo] || 1), a = PS[lo], b = PS[hi];
    const i0 = Math.max(0, lo - 2), i1 = Math.min(PS.length - 1, hi + 2);
    const tx = PS[i1][0] - PS[i0][0], tz = PS[i1][2] - PS[i0][2], tl = Math.hypot(tx, tz) || 1;
    return { p: [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)], t: [tx / tl, 0, tz / tl], r: [-tz / tl, 0, tx / tl] };
  }
  // the closest point on the line (distance, path length, height), plus the line's height blended over every
  // nearby stretch: narrowly for the track bed, broadly for the valley floor, so switchbacks never leave a cliff
  function nearest(x, z) {
    let bd = 1e9, bi = 0, wn = 0, yn = 0, wb = 0, yb = 0;
    for (let i = 0; i < PS.length; i += 2) {
      const dx = x - PS[i][0], dz = z - PS[i][2], d2 = dx * dx + dz * dz;
      if (d2 < bd) { bd = d2; bi = i; }
      if (d2 < 3600) { const k = (1 - d2 / 3600) ** 2; wb += k; yb += k * PS[i][1]; if (d2 < 196) { const q = (1 - d2 / 196) ** 3; wn += q; yn += q * PS[i][1]; } }
    }
    const y = PS[bi][1];
    return { d: Math.sqrt(bd), s: SL[bi], y, yn: wn ? yn / wn : y, yb: wb ? yb / wb : y };
  }

  // the train's timetable: eases out of the first field, stops at the summit station when the build ends
  const S0 = 34, S1 = LEN - 6, SCH = new Float64Array(1001);
  for (let i = 1; i <= 1000; i++) { const p = (i - 0.5) / 1000; SCH[i] = SCH[i - 1] + (0.03 + 0.97 * sm(0, 0.1, p)) * (1 - sm(0.84, 1.0, p)); }
  const trainS = (p) => S0 + (S1 - S0) * (SCH[Math.round(cl(p) * 1000)] / SCH[1000]);
  function pOfS(s) {
    const f = cl((s - S0) / (S1 - S0)) * SCH[1000];
    let lo = 0, hi = 1000;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (SCH[m] <= f) lo = m; else hi = m; }
    return lo / 1000;
  }
  // when something at path length s starts being built: a burst around the start, then a front running ahead of the train
  const W = 0.032;   // build window, in progress (≈ 0.65 s)
  const buildAt = (s, lead) => Math.min(0.955, Math.max(0.006 + 0.06 * cl(s / (S0 + lead + 10)), pOfS(s - lead)));

  // ------------------------------------------------------------------ the land
  const coastX = (z) => 37 + 6 * Math.sin(z * 0.06) + Math.max(0, z - 82) * 0.95 + Math.max(0, -z - 26) * 0.75;
  const ISLE = [coastX(-8) + 15, -8];
  const PEAKS = [[-72, -150, 44, 26], [42, -176, 52, 30], [-104, -82, 30, 26], [72, -122, 34, 26], [0, -228, 62, 36], [-122, -182, 52, 34], [102, -192, 40, 30], [-40, -206, 46, 26], [-62, -20, 14, 26]];
  // the land: rolling fields, a hill above the harbour, and a valley that climbs with the line between snowy peaks
  function land(x, z, nr) {
    const n1 = fbm(x * 0.018 + 3.1, z * 0.018 - 1.7), n2 = noise(x * 0.07, z * 0.07);
    const wM = sm(38, 72, z), wA = sm(-10, -46, z), wT = Math.max(0, 1 - wM - wA);
    const cx = coastX(z);
    let h = (1.4 + (n1 - 0.45) * 7 + (n2 - 0.5) * 1.1) * wM + (1.4 + Math.max(0, cx - x - 9) * 0.2 + (n1 - 0.45) * 4) * wT;
    if (wA > 0) {
      const ridge = 1 - Math.abs(2 * noise(x * 0.03 + 7, z * 0.03 + 2) - 1), rise = Math.max(0, nr.d - 7);
      h += wA * (nr.yb - 1.0 + Math.pow(rise, 1.15) * (0.1 + 0.14 * n1) + ridge * 3 * sm(14, 40, nr.d) + (n2 - 0.5) * 1.2);
    }
    for (const [px, pz, ph, pr] of PEAKS) h += ph * Math.exp(-((x - px) ** 2 + (z - pz) ** 2) / (pr * pr)) * (0.85 + 0.3 * n2);
    h += Math.max(0, -x - 46) * 0.32 * (0.6 + n1);
    const dc = cx - x;
    if (dc < 12) h = Math.min(h, (dc - 2) * 0.34 + (n2 - 0.5) * 0.5);
    const di = Math.hypot(x - ISLE[0], z - ISLE[1]);
    if (di < 11) h = Math.max(h, 4.6 - di * di * 0.055 + (n2 - 0.5) * 0.8);
    return Math.max(h, -5.5);
  }
  function height(x, z, nr = nearest(x, z)) {   // the land, with a bed cut for the line
    let h = land(x, z, nr);
    h = lerp(h, nr.yn - 0.24, sm(13, 3.2, nr.d));
    return nr.d < 2.4 ? lerp(nr.yn, nr.y, sm(2.4, 0, nr.d)) - 0.2 : h;
  }

  // fields beside the line in the first stretch: [path length, side, offset, length, width, crop]
  const FIELDS = [[56, -1, 17, 30, 20, 'sun'], [78, 1, 16, 26, 18, 'lav'], [98, -1, 17, 28, 20, 'wheat'], [120, 1, 16, 30, 18, 'sun'],
                  [138, -1, 16, 22, 16, 'lav'], [68, 1, 40, 26, 22, 'green'], [108, -1, 42, 24, 22, 'wheat'], [146, 1, 36, 22, 18, 'green']]
    .map(([s, side, off, len, wid, crop]) => { const a = pathAt(s); return { c: [a.p[0] + a.r[0] * side * off, a.p[2] + a.r[2] * side * off], u: [a.t[0], a.t[2]], len, wid, crop, s }; });
  const inField = (x, z) => {
    for (const f of FIELDS) {
      const dx = x - f.c[0], dz = z - f.c[1], u = dx * f.u[0] + dz * f.u[1], v = -dx * f.u[1] + dz * f.u[0];
      if (Math.abs(u) < f.len / 2 && Math.abs(v) < f.wid / 2) return { f, u, v };
    }
    return null;
  };

  // ------------------------------------------------------------------ what gets built, where, and when
  const things = {};   // kind → list of instances
  const add = (kind, it) => (things[kind] = things[kind] || []).push(it);
  const clearOf = []; // footprints to keep things apart: [x, z, r]
  const free = (x, z, r) => clearOf.every(([a, b, c]) => (x - a) ** 2 + (z - b) ** 2 > (r + c) ** 2);

  // the track: sleepers and rails, laid just ahead of the train
  for (let s = 0.4; s < LEN - 0.3; s += 0.9) {
    const a = pathAt(s), b = buildAt(s, 24);
    add('sleeper', { x: a.p[0], y: a.p[1] - 0.16, z: a.p[2], ry: Math.atan2(a.t[0], a.t[2]), s, b });
    for (const side of [-0.62, 0.62]) add('rail', { x: a.p[0] + a.r[0] * side, y: a.p[1], z: a.p[2] + a.r[2] * side, ry: Math.atan2(a.t[0], a.t[2]), sz: 0.95, s, b: b + 0.004 });
  }
  for (let s = 0; s < LEN; s += 3) { const a = pathAt(s); clearOf.push([a.p[0], a.p[2], 2.6]); }

  // the fields: sunflowers and lavender in rows, hay bales on the wheat
  for (const f of FIELDS) {
    const lead = 52;
    if (f.crop === 'sun' || f.crop === 'lav') {
      const du = f.crop === 'sun' ? 0.95 : 1.05, dv = f.crop === 'sun' ? 1.1 : 1.25;
      for (let v = -f.wid / 2 + 0.8; v < f.wid / 2 - 0.5; v += dv) for (let u = -f.len / 2 + 0.7; u < f.len / 2 - 0.5; u += du) {
        const x = f.c[0] + f.u[0] * u - f.u[1] * v + rr(-0.15, 0.15), z = f.c[1] + f.u[1] * u + f.u[0] * v + rr(-0.15, 0.15);
        const nr = nearest(x, z);
        if (nr.d < 7) continue;
        add(f.crop === 'sun' ? 'sunflower' : 'lavender', { x, y: height(x, z, nr), z, ry: f.crop === 'sun' ? rr(-0.45, 0.45) : rr(0, 6.28), sx: f.crop === 'sun' ? rr(0.7, 0.9) : rr(0.8, 1.1), s: nr.s, field: FIELDS.indexOf(f), b: buildAt(nr.s + (u + f.len / 2) * 0.35, lead) });
      }
    } else if (f.crop === 'wheat') {
      for (let k = 0; k < 7; k++) {
        const u = rr(-f.len / 2 + 3, f.len / 2 - 3), v = rr(-f.wid / 2 + 3, f.wid / 2 - 3);
        const x = f.c[0] + f.u[0] * u - f.u[1] * v, z = f.c[1] + f.u[1] * u + f.u[0] * v, nr = nearest(x, z);
        add('hay', { x, y: height(x, z, nr), z, ry: rr(0, 6.28), s: nr.s, field: FIELDS.indexOf(f), b: buildAt(nr.s, lead) });
      }
    }
    clearOf.push([f.c[0], f.c[1], Math.min(f.len, f.wid) / 2]);
  }
  // windmills on the hills, and a farm
  for (const [s, side, off] of [[64, -1, 42], [92, 1, 36], [130, -1, 44], [152, 1, 46]]) {
    const a = pathAt(s), x = a.p[0] + a.r[0] * side * off, z = a.p[2] + a.r[2] * side * off, nr = nearest(x, z);
    add('windmill', { x, y: height(x, z, nr) - 0.2, z, ry: 0.6, s: nr.s, b: buildAt(nr.s, 70) });
    clearOf.push([x, z, 4]);
  }
  {
    const a = pathAt(86), x = a.p[0] - a.r[0] * 30, z = a.p[2] - a.r[2] * 30, nr = nearest(x, z), ry = Math.atan2(a.t[0], a.t[2]);
    add('barn', { x, y: height(x, z, nr) - 0.1, z, ry, s: nr.s, b: buildAt(nr.s, 60) });
    add('silo', { x: x + a.t[0] * 5.4, y: height(x + a.t[0] * 5.4, z + a.t[2] * 5.4) - 0.1, z: z + a.t[2] * 5.4, ry, s: nr.s, b: buildAt(nr.s, 60) + 0.01 });
    clearOf.push([x, z, 7]);
  }
  // fences along the line through the fields
  for (let s = 26; s < 150; s += 2.4) for (const side of [-1, 1]) {
    const a = pathAt(s), x = a.p[0] + a.r[0] * side * 4.2, z = a.p[2] + a.r[2] * side * 4.2;
    add('fence', { x, y: height(x, z), z, ry: Math.atan2(a.t[0], a.t[2]), s, b: buildAt(s, 34) + 0.002 });
  }
  // the harbour town: pastel houses up the hill, a church, a pier, boats and a lighthouse on the islet
  const WALLS = ['#f7d9c4', '#f6e7a8', '#c3e4d8', '#f5b9a8', '#cdd9f1', '#fff1df', '#e9d3ef', '#d6ecb5'];
  const ROOFS = ['#c8553d', '#c8553d', '#b4472f', '#5b6b7a', '#d4693f', '#8b5a44'];
  {
    let tries = 0, n = 0;
    while (n < 62 && tries++ < 3000) {
      const s = rr(148, 234), a = pathAt(s), side = rnd() < 0.82 ? -1 : 1, off = side < 0 ? rr(8.5, 36) : rr(5, 9);
      const x = a.p[0] + a.r[0] * side * off + rr(-2, 2), z = a.p[2] + a.r[2] * side * off + rr(-2, 2), nr = nearest(x, z);
      const w = rr(2.4, 3.8), d = rr(2.3, 3.2), hh = rr(2.2, 4.4), y = height(x, z, nr);
      if (nr.d < 4.6 || y < 0.9 || !free(x, z, Math.max(w, d) * 0.62) || coastX(z) - x < 4) continue;
      const ry = Math.atan2(a.r[0], a.r[2]) + (side < 0 ? 0 : Math.PI) + rr(-0.15, 0.15);
      const b = buildAt(nr.s + Math.max(0, nr.d - 8) * 0.3, 58);
      add('house', { x, y: y - 0.25, z, ry, sx: w, sy: hh, sz: d, s: nr.s, b, color: pick(WALLS) });
      add('roof', { x, y: y - 0.25 + hh, z, ry, sx: w, sy: rr(2.0, 3.0), sz: d, s: nr.s, b: b + 0.012, color: pick(ROOFS) });
      clearOf.push([x, z, Math.max(w, d) * 0.62]);
      n++;
    }
    const a = pathAt(192), x = a.p[0] - a.r[0] * 24, z = a.p[2] - a.r[2] * 24, nr = nearest(x, z);
    if (free(x, z, 3)) { add('church', { x, y: height(x, z, nr) - 0.3, z, ry: Math.atan2(a.r[0], a.r[2]), s: nr.s, b: buildAt(nr.s, 64) }); clearOf.push([x, z, 5]); }
    const pz = 30, px0 = coastX(pz) - 3;
    add('pier', { x: px0, y: 0.35, z: pz, ry: Math.PI / 2, s: nearest(px0, pz).s, b: buildAt(nearest(px0, pz).s, 60) });
    for (let k = 0; k < 7; k++) {
      const z = rr(-6, 62), x = coastX(z) + rr(10, 34), nr = nearest(x, z);
      add('boat', { x, y: 0, z, ry: rr(0, 6.28), s: nr.s, b: buildAt(nr.s, 66), seed: rnd() * 10, color: pick(['#ffffff', '#fff2d6', '#ffd9c9']) });
    }
    const nrI = nearest(ISLE[0], ISLE[1]);

    return x < -40 || y < -40 || x > r.right + 40 || y > r.bottom + 40 ? null : { x, y };
  };
  const fmt = (n) => n.toLocaleString('en-US');
  function drawMarks(p) {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    if (marks.width !== Math.round(r.width * dpr)) { marks.width = Math.round(r.width * dpr); marks.height = Math.round(r.height * dpr); }
    mx.setTransform(dpr, 0, 0, dpr, 0, 0);
    mx.clearRect(0, 0, r.width, r.height);
    if (p <= 0 || p >= 1.05) return;
    mx.font = '600 10px "JetBrains Mono", ui-monospace, monospace';
    mx.textBaseline = 'middle';
    const taken = [];
    for (const c of clusters) {
      const a = Math.min(sm(c.b0 - 0.004, c.b0 + 0.004, p), 1 - sm(c.b1 + 0.01, c.b1 + 0.03, p));
      if (a <= 0.01) continue;
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, ok = 0;
      for (let k = 0; k < 8; k++) {
        const q = [k & 1 ? c.max[0] : c.min[0], k & 2 ? c.max[1] : c.min[1], k & 4 ? c.max[2] : c.min[2]];
        viewP.set(q[0], q[1], q[2]).applyMatrix4(camera.matrixWorldInverse);
        if (viewP.z > -camera.near) continue;
        corners.set(q[0], q[1], q[2]).project(camera);
        const sx = (corners.x * 0.5 + 0.5) * r.width, sy = (0.5 - corners.y * 0.5) * r.height;
        x0 = Math.min(x0, sx); y0 = Math.min(y0, sy); x1 = Math.max(x1, sx); y1 = Math.max(y1, sy); ok++;
      }
      if (ok < 4) continue;
      x0 = Math.max(x0, -2); y0 = Math.max(y0, -2); x1 = Math.min(x1, r.width + 2); y1 = Math.min(y1, r.height + 2);
      const w = x1 - x0, h = y1 - y0;
      if (w < 10 || h < 8 || w > r.width * 0.72 || h > r.height * 0.72) continue;
      mx.globalAlpha = a;
      mx.strokeStyle = CORAL; mx.lineWidth = 1;
      mx.strokeRect(Math.round(x0) + 0.5, Math.round(y0) + 0.5, Math.round(w), Math.round(h));
      mx.fillStyle = '#fff';
      for (const [hx, hy] of [[x0, y0], [x1, y0], [x0, y1], [x1, y1]]) { mx.fillRect(Math.round(hx) - 2, Math.round(hy) - 2, 5, 5); mx.strokeRect(Math.round(hx) - 2 + 0.5, Math.round(hy) - 2 + 0.5, 4, 4); }
      const text = c.n > 1 ? c.label + ' ×' + fmt(c.n) : c.label, tw = mx.measureText(text).width + 12;
      const lx = Math.round(Math.min(Math.max(x0, 4), r.width - tw - 4)), ly = Math.round(y0 - 20);
      if (ly < 2 || taken.some((q) => lx < q[0] + q[2] + 4 && lx + tw + 4 > q[0] && ly < q[1] + 18 && ly + 18 > q[1])) continue;
      taken.push([lx, ly, tw]);
      mx.fillStyle = CORAL;
      mx.beginPath(); mx.roundRect(lx, ly, tw, 16, 4); mx.fill();
      mx.fillStyle = '#fff'; mx.fillText(text, lx + 6, ly + 8.5);
    }
    mx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------ build sites for the crew
  // sixty jobs spread evenly over the journey; each goes to whoever has been idle longest
  {
    const pool = clusters.filter((c) => BY[c.label]).sort((a, b) => a.b0 - b.b0), last = { conductor: 0.004 };
    const chosen = [{ label: 'Train', b0: 0.004, by: 'conductor', train: true }];
    const SLOTS = 60, T1 = 0.93;
    for (let k = 0; k < SLOTS; k++) {
      const w0 = (k * T1) / SLOTS, w1 = ((k + 1) * T1) / SLOTS;
      let best = null, idle = -1;
      for (const c of pool) {
        if (c.used || c.b0 < w0 - 0.01 || c.b0 >= w1) continue;
        for (const by of BY[c.label]) { const d = c.b0 - (last[by] ?? -1); if (d >= 0.035 && d > idle) { idle = d; best = { c, by }; } }
      }
      if (best) { best.c.used = true; last[best.by] = best.c.b0; chosen.push({ ...best.c, by: best.by }); }
    }
    chosen.forEach((c, i) => {
      const fn = c.train ? () => project(loco.position.toArray().map((v, k) => v + (k === 1 ? 1.6 : 0))) : () => centre(c, build);
      swarm.anchor('site-' + i, fn, { at: Math.max(0, c.b0 - 0.012), by: c.by, hold: 0.9, label: false, say: 'building ' + c.label.toLowerCase() });
    });
  }
  swarm.start();

  // ------------------------------------------------------------------ render
  function resize() {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, r.width < 700 ? 1.6 : 2);
    gl.setPixelRatio(dpr); gl.setSize(r.width, r.height, false);
    camera.aspect = r.width / Math.max(1, r.height);
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  const tmpQ = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
  function place(obj, s) {
    const a = pathAt(s), b = pathAt(s + 0.8), c = pathAt(s - 0.8);
    obj.position.set(a.p[0], a.p[1] + 0.13, a.p[2]);
    obj.lookAt(b.p[0], b.p[1] + 0.13, b.p[2]);
  }
  function render(p, t) {
    const sT = trainS(p), reveal = readyAt === null ? (p >= 1 ? 1 : 0) : (reduce ? 1 : sm(0.3, 6.6, t - readyAt));
    const golden = sm(0.66, 1.0, p) * 0.88 + 0.12 * reveal;
    // camera
    // the look back: the camera arcs up over the station and turns round (heading and pitch, never through the ground)
    const ch = chase(sT), arc = Math.sin(Math.PI * reveal) * 16, e = reveal, eg = sm(0.0, 0.6, reveal);
    const drift = reduce ? 0 : Math.sin(t * 0.05) * 6 * reveal;
    camera.position.set(lerp(ch.pos[0], REVEAL.pos[0] + drift, e), lerp(ch.pos[1], REVEAL.pos[1], e) + arc, lerp(ch.pos[2], REVEAL.pos[2], e));
    const aim = (from, to) => { const dx = to[0] - from[0], dy = to[1] - from[1], dz = to[2] - from[2], l = Math.hypot(dx, dy, dz) || 1; return [Math.atan2(dx, dz), Math.asin(dy / l)]; };
    const [yc, p0] = aim(ch.pos, ch.tgt), [y1, p1] = aim(REVEAL.pos, REVEAL.tgt);
    const y0 = ((yc % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);   // from heading north, turn round by the east: past the sea
    const yaw = lerp(y0, y1, eg), pitch = lerp(p0, p1, eg) - Math.sin(Math.PI * eg) * 0.1;
    camera.lookAt(camera.position.x + Math.sin(yaw) * Math.cos(pitch), camera.position.y + Math.sin(pitch), camera.position.z + Math.cos(yaw) * Math.cos(pitch));
    const portrait = camera.aspect < 0.9;
    camera.fov = lerp(portrait ? 64 : 50, portrait ? 60 : 44, e); camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
    // time of day: bright morning to golden hour
    const sunEl = lerp(0.9, 0.22, golden), sunAz = lerp(-0.75, -1.42, golden);
    const sd = new THREE.Vector3(Math.sin(sunAz) * Math.cos(sunEl), Math.sin(sunEl), Math.cos(sunAz) * Math.cos(sunEl));
    skyU.uSun.value.copy(sd);
    skyU.uZen.value.set('#2c7fdc').lerp(C('#5f7fc6'), golden);
    skyU.uHzn.value.set('#c8e5f6').lerp(C('#f7d6b4'), golden);
    skyU.uSunCol.value.set('#fff1d8').lerp(C('#ffb36a'), golden);
    skyU.uGlow.value = lerp(0.35, 1.0, golden);
    scene.fog.color.copy(skyU.uHzn.value);
    scene.fog.near = lerp(70, 160, e); scene.fog.far = lerp(360, 760, e);
    sunL.color.set('#fff3df').lerp(C('#ffbd7a'), golden); sunL.intensity = lerp(2.6, 3.0, golden);
    hemi.color.set('#cfe9ff').lerp(C('#ffe0c4'), golden); hemi.groundColor.set('#7a9a5a').lerp(C('#7d6a52'), golden); hemi.intensity = lerp(1.15, 1.3, golden);
    const focus = new THREE.Vector3(lerp(ch.tgt[0], 0, e), lerp(ch.tgt[1], 10, e), lerp(ch.tgt[2], -40, e)), ext = lerp(46, 190, e);
    sunL.position.copy(focus).addScaledVector(sd, 260); sunL.target.position.copy(focus);
    const sc = sunL.shadow.camera; sc.left = -ext; sc.right = ext; sc.top = ext; sc.bottom = -ext; sc.near = 10; sc.far = 600; sc.updateProjectionMatrix();
    sky.position.copy(camera.position);
    // the build front and things that move
    U.uP.value = p; U.uT.value = t;
    for (const m of Object.values(meshes)) m.w.visible = p > m.b0 - 0.001 && p < m.b1 + 0.001;
    if (meshes.windmill) things.windmill.forEach((it, i) => {
      const a = it.ry || 0, hub = { ...it, x: it.x + Math.sin(a) * 1.15, y: it.y + 6.8, z: it.z + Math.cos(a) * 1.15, rz: t * 1.3 + i };
      compose(hub); blades.a.setMatrixAt(i, mats); blades.w.setMatrixAt(i, mats);
    });
    if (blades) { blades.a.instanceMatrix.needsUpdate = blades.w.instanceMatrix.needsUpdate = true; }
    if (meshes.boat) { things.boat.forEach((it, i) => { compose({ ...it, y: Math.sin(t * 1.4 + it.seed) * 0.14 - 0.05, rx: Math.sin(t * 1.1 + it.seed) * 0.05, rz: Math.cos(t * 0.9 + it.seed) * 0.06 }); meshes.boat.a.setMatrixAt(i, mats); meshes.boat.w.setMatrixAt(i, mats); }); meshes.boat.a.instanceMatrix.needsUpdate = meshes.boat.w.instanceMatrix.needsUpdate = true; }
    if (meshes.cloud) { things.cloud.forEach((it, i) => { compose({ ...it, x: it.x + Math.sin(t * 0.03 + i) * 4, z: it.z + Math.sin(t * 0.02 + i * 2) * 8 }); meshes.cloud.a.setMatrixAt(i, mats); meshes.cloud.w.setMatrixAt(i, mats); }); meshes.cloud.a.instanceMatrix.needsUpdate = meshes.cloud.w.instanceMatrix.needsUpdate = true; }
    place(loco, sT); place(coaches[0], sT + OFFS[1]); place(coaches[1], sT + OFFS[2]);
    // smoke: a puff every 0.12 s while the train runs
    const moving = p > 0.03 && p < 0.995;
    for (let i = 0; i < PUFFS; i++) {
      const born = Math.floor(t / 0.11) * 0.11 - i * 0.11, age = t - born;
      if (!moving || age > 1.9 || born < 0) { mats.makeScale(0, 0, 0); puffMesh.setMatrixAt(i, mats); continue; }
      const a = pathAt(sT + 2.25 - age * 3.4), k = age / 1.9;   // trails back over the train, never into the camera
      const size = (0.4 + age * 0.62) * (1 - sm(0.6, 1, k));
      mats.compose(vec.set(a.p[0] + Math.sin(born * 7) * 0.35 * age, a.p[1] + 3.1 + age * 1.9, a.p[2] + Math.cos(born * 5) * 0.35 * age), quat.identity(), scl.set(size, size * 0.85, size));
      puffMesh.setMatrixAt(i, mats);
    }
    puffMesh.instanceMatrix.needsUpdate = true;
    glowMat.opacity = sm(0.86, 1.0, p) * 0.9 + 0.1 * reveal;
    glowMat.size = lerp(2.4, 6, e);
    gl.render(scene, camera);
    drawMarks(p);
  }

  let last = performance.now(), readySent = false, fontsReady = false;
  document.fonts.load('600 10px "JetBrains Mono"').then(() => { fontsReady = true; }, () => { fontsReady = true; });
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!heard && !root.classList.contains('swarm-js')) build = 1;   // the engine never came: show the finished world
    if (!reduce) clock += dt;
    if (build >= 1 && readyAt === null) readyAt = clock;
    render(build, clock);
    if (!readySent) { readySent = true; swarm.ready(canvas); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
