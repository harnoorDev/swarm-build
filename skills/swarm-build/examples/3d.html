<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071226">
<title>swarm-build · a crew builds a city</title>
<meta name="description" content="swarm-build on a 3D scene: a crew of agents surveys the streets, raises the blocks, clads the towers and switches on the lights of a WebGL city while you watch.">
<!-- 1 · The head snippet (once: 'always' for this demo; see references/api.md). -->
<script>
(function () {
  try {
    var d = document.documentElement;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (localStorage.getItem('swarm-build-off') === '1') return;
    d.classList.add('swarm-js');
    setTimeout(function () { if (!window.__swarmBuild) d.classList.remove('swarm-js'); }, 6000);
  } catch (e) {}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/swarm-build.css">
<style>
  :root { color-scheme: dark; --sb-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(120% 90% at 50% 45%, #0a1a31 0%, #050c19 100%) #071226; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  main { position: fixed; inset: 0; }
  #city { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* the only control: build it again, shown once the crew has left */
  .again {
    position: absolute; right: calc(20px + env(safe-area-inset-right)); bottom: calc(20px + env(safe-area-inset-bottom));
    width: 46px; height: 46px; display: grid; place-items: center; padding: 0; border-radius: 50%;
    border: 1px solid rgba(255, 236, 214, .28); background: rgba(12, 12, 26, .42); color: #ffe9d2; cursor: pointer;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .6s ease, transform .6s ease, background-color .2s;
  }
  main.swarm-done .again { opacity: 1; transform: none; pointer-events: auto; transition-delay: .4s, .4s, 0s; }
  .again:hover { background: rgba(40, 32, 60, .6); }
  .again:focus-visible { outline: 2px solid #b49bff; outline-offset: 3px; }
  .again svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<!-- 2 · Markup. One full-screen canvas with data-swarm-step="scene". data-swarm-sweep="none" lets the
     city build itself (no wipe), data-swarm-duration gives it seven seconds, and the build sites
     registered with swarm.anchor(…, { at, by }) send each trade to where the city is going up. -->
<main data-swarm>
  <h1 class="sr-only">A crew of agents builds a city</h1>
  <canvas id="city" data-swarm-step="scene" data-swarm-label="city" data-swarm-sweep="none" data-swarm-duration="7" data-swarm-await
          role="img" aria-label="A city at dusk seen from above: a grid of streets, glass towers around a central plaza with an obelisk, two parks, lit windows and traffic."></canvas>
  <button class="again" type="button" aria-label="Build the city again">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/></svg>
  </button>
</main>

<!-- 3 · The engine, a crew of trades, and a WebGL city that follows swarm:scene progress. -->
<script type="module">
  import { swarmBuild } from '../assets/swarm-build.js';

  const crew = {
    renderer: '#b49bff', surveyor: '#4ee9f5', mason: '#ffb547', steelworker: '#e7ff52',
    glazier: '#6aa8ff', gardener: '#8dffb9', electrician: '#ff8fd8',
  };
  const swarm = swarmBuild({ once: 'always', crew });
  const canvas = document.getElementById('city');
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelector('.again').addEventListener('click', () => swarm.replay());

  // Build progress 0 → 1 comes from the crew. With no build (reduced motion, effect off) the city is finished.
  let build = root.classList.contains('swarm-js') ? 0 : 1, heard = false, dirty = true;
  canvas.addEventListener('swarm:scene', (e) => { heard = true; build = e.detail.progress; dirty = true; });

  // ------------------------------------------------------------------ helpers
  const cl = (x) => Math.min(1, Math.max(0, x));
  const sm = (x) => x * x * (3 - 2 * x);
  const mix = (a, b, k) => (typeof a === 'number' ? a + (b - a) * k : a.map((v, i) => v + (b[i] - v) * k));
  const span = (p, a, b) => sm(cl((p - a) / (b - a)));
  let seed = 20261104;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  // the three waves of the build, shared by the shaders and the build sites
  const geoOf = (p) => cl(p / 0.45), matOf = (p) => cl((p - 0.45) / 0.35), litOf = (p) => cl((p - 0.8) / 0.2);
  // the survey and the paving spread out from the plaza; once past the city the paving races off to the horizon
  const surveyR = (p) => cl(p / 0.2) * 34;
  const paveR = (p) => { const m = matOf(p) / 0.55; return m <= 1 ? m * 31 : 31 + (m - 1) * 900; };
  const lampAt = (x, z) => 0.55 * cl(Math.hypot(x, z) / 26);

  // ------------------------------------------------------------------ the plan of the city
  const N = 9, MID = 4, BLOCK = 3.2, ROAD = 1.1, PITCH = BLOCK + ROAD, WALK = 0.24, S2 = BLOCK / 2 - WALK;
  const TOWER = [4, 3], PLAZA = [4, 4], PARKS = [[6, 5], [1, 2]];
  const at = (i) => (i - MID) * PITCH;
  const buildings = [], trees = [], kit = [];
  const slotFor = (x, z) => Math.hypot(x, z) / 24.4;

  function addBuilding(cx, cz, w, d, H, type, opts = {}) {
    const dW = slotFor(cx, cz);
    const b = {
      cx, cz, w, d, H, type, seed: rnd(),
      slot: opts.slot ?? 0.05 + 0.64 * dW + 0.06 * rnd(), riseD: opts.riseD ?? 0.16 + 0.022 * H,
      slotM: opts.slotM ?? 0.03 + 0.5 * dW + 0.06 * rnd(), tiers: [],
    };
    if (opts.tiers) b.tiers = opts.tiers;
    else if (H > 4.2 && Math.min(w, d) > 1.0 && rnd() < 0.85) {
      const k = rnd() < 0.6;
      b.tiers = k ? [[0, 0.6, 1], [0.6, 0.85, 0.78], [0.85, 1, 0.56]] : [[0, 0.72, 1], [0.72, 1, 0.7]];
    } else if (H > 2.4 && rnd() < 0.35) b.tiers = [[0, 0.76, 1], [0.76, 1, 0.72]];
    else b.tiers = [[0, 1, 1]];
    buildings.push(b);
    // a few boxes on the roof: plant rooms, water tanks
    const top = b.tiers[b.tiers.length - 1], tw = w * top[2], td = d * top[2];
    if (!opts.bare && tw > 0.55 && td > 0.55 && rnd() < 0.8) {
      const n = 1 + Math.floor(rnd() * 3);
      for (let k = 0; k < n; k++) {
        const kw = 0.12 + rnd() * 0.22, kd = 0.12 + rnd() * 0.22;
        kit.push({ b, x: cx + (rnd() - 0.5) * (tw - kw - 0.16), z: cz + (rnd() - 0.5) * (td - kd - 0.16), w: kw, d: kd, h: 0.08 + rnd() * 0.12 });
      }
    }
    return b;
  }
  function addTree(x, z, slotM) {
    const dia = 0.34 + rnd() * 0.28;
    trees.push({ x, z, dia, h: dia * (1.0 + rnd() * 0.35), trunk: 0.1 + rnd() * 0.1, seed: rnd(), slotM });
  }

  let tower = null, monument = null;
  const parkAt = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const bx = at(i), bz = at(j);
    const blockM = 0.03 + 0.5 * slotFor(bx, bz);
    if (i === PLAZA[0] && j === PLAZA[1]) {
      // the plaza: an obelisk on a plinth, ringed by trees
      monument = { cx: bx, cz: bz, H: 3.23, slot: 0.02, riseD: 0.25, slotM: 0.0, seed: rnd() };
      for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) addTree(bx + x * 1.06, bz + z * 1.06, 0.06 + rnd() * 0.05);
      for (const [x, z] of [[0, -1], [0, 1], [-1, 0], [1, 0]]) addTree(bx + x * 1.12 + (x ? 0 : 0.42), bz + z * 1.12 + (z ? 0 : 0.42), 0.08 + rnd() * 0.05);
      continue;
    }
    if (PARKS.some(([a, c]) => a === i && c === j)) {
      parkAt.push([bx, bz]);
      let n = 0, tries = 0;
      while (n < 18 && tries++ < 400) {
        const x = (rnd() * 2 - 1) * (S2 - 0.22), z = (rnd() * 2 - 1) * (S2 - 0.22);
        if (Math.abs(x - z) < 0.3 || Math.abs(x + z) < 0.3 || Math.abs(Math.hypot(x, z) - 0.8) < 0.24) continue;
        addTree(bx + x, bz + z, blockM - 0.02 + rnd() * 0.1);
        n++;
      }
      continue;
    }
    if (i === TOWER[0] && j === TOWER[1]) {
      // the landmark: a podium and a glass tower stepping back twice, topped with a spire
      addBuilding(bx, bz, 2.72, 2.72, 0.9, 1, { slot: 0.03, riseD: 0.18, slotM: 0.02, bare: true });
      tower = addBuilding(bx, bz, 1.9, 1.9, 13.3, 0, {
        slot: 0.03, riseD: 0.55, slotM: 0.0, bare: true,
        tiers: [[0, 6.5 / 13.3, 1], [6.5 / 13.3, 9.4 / 13.3, 0.79], [9.4 / 13.3, 11.5 / 13.3, 0.58], [11.5 / 13.3, 1, 0.045, 5]],
      });
      continue;
    }
    const edge = i === 0 || j === 0 || i === N - 1 || j === N - 1;
    const down = Math.exp(-((i - 4) ** 2 + ((j - 3.4) * 1.1) ** 2) / 5.5);
    const hMax = edge ? 0.7 + rnd() * 0.9 : 0.9 + 8.0 * down;
    const g = 0.07, r = rnd();
    let lots;
    if (!edge && hMax > 5.2 && r < 0.55) lots = [[-S2, -S2, S2, S2]];
    else if (r < 0.3) lots = rnd() < 0.5 ? [[-S2, -S2, -g, S2], [g, -S2, S2, S2]] : [[-S2, -S2, S2, -g], [-S2, g, S2, S2]];
    else if (r < 0.66) lots = [[-S2, -S2, -g, -g], [g, -S2, S2, -g], [-S2, g, -g, S2], [g, g, S2, S2]];
    else lots = rnd() < 0.5 ? [[-S2, -S2, -g, S2], [g, -S2, S2, -g], [g, g, S2, S2]] : [[-S2, -S2, S2, -g], [-S2, g, -g, S2], [g, g, S2, S2]];
    for (const [x0, z0, x1, z1] of lots) {
      const w = x1 - x0 - 0.06, d = z1 - z0 - 0.06;
      const size = Math.sqrt(w * d) / (2 * S2);
      const H = Math.max(0.45, Math.min(11, hMax * (0.5 + 0.5 * rnd()) * (0.45 + 0.55 * size)));
      const type = H > 4.5 ? (rnd() < 0.65 ? 0 : 1) : H > 1.7 ? (rnd() < 0.18 ? 0 : 1) : 2;
      addBuilding(bx + (x0 + x1) / 2, bz + (z0 + z1) / 2, w, d, H, type);
    }
  }

  // ------------------------------------------------------------------ build sites for the crew
  const heightNow = (b, p) => sm(cl((geoOf(p) - b.slot) / b.riseD)) * b.H;
  const cladNow = (b, p) => cl((matOf(p) - b.slotM) / 0.28) * b.H;
  const pick = (list, score) => (list.length ? list : buildings).reduce((best, b) => (score(b) < score(best) ? b : best));
  const plain = buildings.filter((b) => b !== tower && b.H > 1.4);
  const B1 = pick(plain, (b) => b.slot);
  const B2 = pick(plain.filter((b) => b.cz > 2 && Math.abs(b.cx) < 13), (b) => Math.abs(b.slot - 0.5));
  const B3 = pick(plain.filter((b) => b.cz < -3 && Math.abs(b.cx) < 14), (b) => -b.slot);
  const B4 = pick(plain.filter((b) => b.cz > 3 && Math.abs(b.cx) < 12), (b) => Math.abs(b.slotM - 0.42));
  const cam = { vp: null, eye: [0, 40, 40], right: [1, 0, 0], fwd: [0, -1, 0], sun: [0, 0.1, -1], rect: { left: 0, top: 0, width: 1, height: 1 } };
  function project(p) {
    const m = cam.vp;
    if (!m) return null;
    const x = m[0] * p[0] + m[4] * p[1] + m[8] * p[2] + m[12], y = m[1] * p[0] + m[5] * p[1] + m[9] * p[2] + m[13];
    const w = m[3] * p[0] + m[7] * p[1] + m[11] * p[2] + m[15];
    if (w < 0.2) return null;
    const r = cam.rect, sx = r.left + (x / w * 0.5 + 0.5) * r.width, sy = r.top + (0.5 - y / w * 0.5) * r.height;
    return sx < -30 || sy < -30 || sx > r.left + r.width + 30 || sy > r.top + r.height + 30 ? null : { x: sx, y: sy };
  }
  const roof = (b) => () => project([b.cx, heightNow(b, build) + 0.04, b.cz]);
  const facade = (b) => () => {   // the corner nearest the camera, where the cladding front is
    const sx = Math.sign(cam.eye[0] - b.cx) || 1, sz = Math.sign(cam.eye[2] - b.cz) || 1;
    return project([b.cx + sx * b.w * 0.5, Math.max(0.2, cladNow(b, build) - 0.05), b.cz + sz * b.d * 0.5]);
  };
  const front = (radius, turn, side, cap) => () => {  // a point on an expanding front, off to one side of the view
    const v = norm([side * cam.right[0] + cam.fwd[0] * turn, 0, side * cam.right[2] + cam.fwd[2] * turn]);
    const r = Math.min(radius(build), cap);
    return project([v[0] * r, 0.02, v[2] * r]);
  };
  const lampX = -0.5 * PITCH + 0.65, lampZ = 1.5 * PITCH - 0.65;
  const sites = [
    ['plaza', 'surveyor', 0.0, 0.5, 'staking out the plaza', () => project([0, 0.05, 0])],
    ['survey', 'surveyor', 0.13, 1.0, 'surveying the street grid', front(surveyR, 0.25, -1, 21)],
    ['footing', 'mason', 0.06, 0.8, 'pouring the first block', roof(B1)],
    ['tower', 'steelworker', 0.11, 1.7, 'topping out the tower', roof(tower)],
    ['midrise', 'mason', 0.24, 0.8, 'raising the next blocks', roof(B2)],
    ['outskirts', 'steelworker', 0.40, 0.7, 'framing the outer blocks', roof(B3)],
    ['glass', 'glazier', 0.47, 0.9, 'glazing the tower', facade(tower)],
    ['paving', 'mason', 0.52, 0.8, 'paving the streets', front(paveR, -0.2, 1, 15)],
    ['park', 'gardener', 0.55, 1.1, 'planting the park', () => project([parkAt[0][0], 0.45, parkAt[0][1]])],
    ['facades', 'glazier', 0.62, 0.7, 'cladding the facades', facade(B4)],
    ['lamps', 'electrician', 0.80, 0.6, 'switching on the street lamps', () => project([lampX, 0.3, lampZ])],
    ['sun', 'renderer', 0.95, 1.0, 'setting the sun', () => project(cam.eye.map((v, i) => v + cam.sun[i] * 300))],
    ['beacon', 'electrician', 0.94, 0.7, 'lighting up the tower', () => project([tower.cx, tower.H + 0.12, tower.cz])],
  ];
  sites.forEach(([name, by, p, hold, say, fn]) => swarm.anchor(name, fn, { at: p, by, hold, say, label: false }));

  // ------------------------------------------------------------------ WebGL
  const gl = canvas.getContext('webgl', { antialias: true, alpha: false, powerPreference: 'high-performance' });
  swarm.start();
  if (!gl) { swarm.ready(canvas); throw new Error('[city] WebGL is not available'); }
  const deriv = gl.getExtension('OES_standard_derivatives');
  const FS_HEAD = (deriv ? '#extension GL_OES_standard_derivatives : enable\n#define DERIV 1\n' : '') +
    '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n';
  // fragment-only uniforms; no uniform is shared with a vertex shader, so precisions never clash
  const COMMON = `
    uniform vec2 uRes;
    uniform vec3 uHzn, uHznSun, uZen, uSunDir, uSunCol, uSkyAmb, uGndAmb, uEye;
    uniform float uGlow, uFogS, uFogK, uPxW;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
    float sunward(vec3 d) { vec2 h = normalize(d.xz + vec2(1e-5)), s = normalize(uSunDir.xz + vec2(1e-5)); return max(dot(h, s), 0.0); }
    // the colour of the air at the horizon in direction d: used by the sky, and as fog by everything else
    vec3 haze(vec3 d) {
      float sd = max(dot(normalize(d), uSunDir), 0.0);
      vec3 c = mix(uHzn, uHznSun, pow(sunward(d), 6.0));
      return c + uSunCol * uGlow * (pow(sd, 12.0) * 0.22 + pow(sd, 90.0) * 0.45);
    }
    vec3 fogged(vec3 col, vec3 wp) {
      vec3 d = wp - uEye;
      float f = 1.0 - exp(-pow(max(length(d) - uFogS, 0.0) * uFogK, 1.35));
      return mix(col, haze(d), clamp(f, 0.0, 1.0));
    }
    float vig() { vec2 q = gl_FragCoord.xy / uRes - 0.5; q.x *= uRes.x / uRes.y; return mix(0.7, 1.0, smoothstep(1.0, 0.22, length(q))); }
    float pxw(float dist) { return max(uPxW * dist, 1e-4); }
  `;

  const SKY_VS = `attribute vec2 aQ; varying vec2 vQ; void main() { vQ = aQ; gl_Position = vec4(aQ, 0.9999, 1.0); }`;
  const SKY_FS = FS_HEAD + COMMON + `
    varying vec2 vQ;
    uniform vec3 uR, uU, uF, uMid, uMidSun; uniform vec2 uTan; uniform float uStars;
    void main() {
      vec3 d = normalize(uF + vQ.x * uTan.x * uR + vQ.y * uTan.y * uU);
      // horizon haze → a band a few degrees up → the zenith
      vec3 mid = mix(uMid, uMidSun, pow(sunward(d), 4.0));
      vec3 col = d.y < 0.1 ? mix(haze(d), mid, smoothstep(0.0, 0.1, d.y)) : mix(mid, uZen, smoothstep(0.1, 0.45, d.y));
      float sd = max(dot(d, uSunDir), 0.0);
      col += uSunCol * uGlow * smoothstep(0.0, 0.02, d.y) * smoothstep(0.99991, 0.99996, sd) * 1.2;   // the disc, cut by the horizon
      if (d.y > 0.04) {
        vec2 p = d.xz / (d.y + 0.35) * 70.0, c = floor(p), f = fract(p) - 0.5;
        vec2 o = vec2(hash(c + 7.1), hash(c + 3.7)) - 0.5;
        float s = step(0.985, hash(c)) * smoothstep(0.1, 0.0, length(f - o * 0.6));
        col += vec3(0.85, 0.9, 1.0) * s * uStars * smoothstep(0.06, 0.4, d.y) * (0.35 + 0.65 * hash(c + 1.3));
      }
      if (d.y < 0.0) col = haze(d);
      gl_FragColor = vec4(col * vig(), 1.0);
    }`;

  const GROUND_VS = `attribute vec2 aQ; uniform mat4 uVP; varying vec3 vW;
    void main() { vW = vec3(aQ.x * 320.0, 0.0, aQ.y * 320.0); gl_Position = uVP * vec4(vW, 1.0); }`;
  const GROUND_FS = FS_HEAD + COMMON + `
    varying vec3 vW;
    uniform float uSurvey, uPave, uLit;
    uniform vec4 uParks;
    const float P = ${PITCH.toFixed(2)}, BH = ${(BLOCK / 2).toFixed(2)}, WALK = ${WALK.toFixed(2)}, CITY = ${(4.5 * PITCH).toFixed(3)};
    float ln(float d, float w) { return 1.0 - smoothstep(w * 0.5, w * 1.5, d); }
    void main() {
      vec2 w = vW.xz;
      float dist = length(uEye - vW), pw = pxw(dist);
    #ifdef DERIV
      pw = max(pw, max(fwidth(w.x), fwidth(w.y)));
    #endif
      vec2 gi = floor(w / P + 0.5), l = w - gi * P, al = abs(l);
      float inside = step(max(abs(gi.x), abs(gi.y)), 4.0);
      float inCity = step(max(abs(w.x), abs(w.y)), CITY);
      float isBlock = inside * step(al.x, BH) * step(al.y, BH);
      float isRoad = inCity * (1.0 - isBlock);
      float ds = length(w);

      // the survey: a blueprint grid that spreads out from the plaza
      vec3 bp = vec3(0.03, 0.072, 0.135);
      float sv = step(ds, uSurvey);
      vec2 fg = abs(fract(w + 0.5) - 0.5);
      float fine = max(ln(fg.x, pw), ln(fg.y, pw)) * 0.1;
      float outline = ln(abs(max(al.x, al.y) - BH), pw * 1.3) * inside;
      float centre = (ln(abs(P * 0.5 - al.y), pw) * step(al.x, BH) * step(0.5, fract(w.x / 0.9))
                    + ln(abs(P * 0.5 - al.x), pw) * step(al.y, BH) * step(0.5, fract(w.y / 0.9))) * inCity;
      bp += vec3(0.3, 0.62, 0.86) * (fine * smoothstep(uSurvey, uSurvey - 5.0, ds) + (outline * 0.85 + centre * 0.35) * inCity * sv);
      bp += vec3(0.3, 0.86, 1.0) * exp(-abs(ds - uSurvey) * 1.6) * 0.55 * step(0.01, uSurvey) * step(uSurvey, 30.5);

      // the finished ground: asphalt, kerbs and pavements, markings, parks, the plaza, fields beyond
      vec3 alb = vec3(0.105, 0.11, 0.105) + 0.025 * (hash(floor(w / 6.0)) - 0.5);

    day: { zen: [0.22, 0.38, 0.62], mid: [0.47, 0.58, 0.74], midSun: [0.84, 0.78, 0.68], hzn: [0.82, 0.79, 0.74], sunH: [0.98, 0.86, 0.66],
           sun: [0.95, 0.84, 0.68], sky: [0.5, 0.57, 0.7], gnd: [0.32, 0.28, 0.24], glow: 0.45, el: 0.5, stars: 0, az: 0.95 },
    dusk: { zen: [0.04, 0.05, 0.14], mid: [0.24, 0.18, 0.34], midSun: [0.66, 0.33, 0.3], hzn: [0.38, 0.26, 0.39], sunH: [1.0, 0.56, 0.28],
            sun: [0.95, 0.46, 0.22], sky: [0.25, 0.27, 0.47], gnd: [0.12, 0.08, 0.1], glow: 1.0, el: 0.016, stars: 1, az: Math.PI - 0.16 },
  };
  const AZ = 0.42;
  function env(p) {
    const k1 = span(p, 0.4, 0.56), k2 = span(p, 0.78, 1.0), o = {};
    for (const key of Object.keys(ENV.plan)) o[key] = mix(mix(ENV.plan[key], ENV.day[key], k1), ENV.dusk[key], k2);
    // the sun swings round from behind the camera to set in front of it (beside the spire on a narrow screen)
    const az = AZ + o.az + (cssW / cssH < 0.9 ? -0.09 : 0) * span(p, 0.78, 1.0);
    o.dir = [Math.sin(az) * Math.cos(o.el), Math.sin(o.el), Math.cos(az) * Math.cos(o.el)];
    return o;
  }
  function camera(p, t, w, h) {
    const aspect = w / h, portrait = aspect < 0.9;
    const fov = (portrait ? 46 : aspect < 1.3 ? 38 : 32) * Math.PI / 180;
    const half = Math.min(fov / 2, Math.atan(Math.tan(fov / 2) * aspect));
    const q = span(p, 0.15, 1.0), settle = span(p, 0.9, 1.0);
    const D = (portrait ? 11.5 : 16.5) / Math.sin(half) * mix(1.1, 0.85, sm(cl(p)));
    const pitch = mix(1.0, portrait ? 0.24 : 0.18, q);
    const az = AZ + mix(-0.8, 0, sm(cl(p))) + (reduce ? 0 : 0.17 * Math.sin(t * 0.05)) * settle;
    const target = [0, mix(0, 1.9, q), -mix(0, 1.5, q)];
    const eye = [target[0] + Math.sin(az) * Math.cos(pitch) * D, target[1] + Math.sin(pitch) * D, target[2] + Math.cos(az) * Math.cos(pitch) * D];
    const f = norm(sub(target, eye)), r = norm(cross(f, [0, 1, 0])), u = cross(r, f);
    const view = [r[0], u[0], -f[0], 0, r[1], u[1], -f[1], 0, r[2], u[2], -f[2], 0, -dot(r, eye), -dot(u, eye), dot(f, eye), 1];
    const near = 0.5, far = 800, fy = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
    const proj = [fy / aspect, 0, 0, 0, 0, fy, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0];
    const vp = new Array(16);
    for (let c = 0; c < 4; c++) for (let rr = 0; rr < 4; rr++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += proj[k * 4 + rr] * view[c * 4 + k];
      vp[c * 4 + rr] = s;
    }
    return { vp, eye, f, r, u, fov, aspect, D };
  }

  // ------------------------------------------------------------------ render
  let W = 0, Hh = 0, cssW = 1, cssH = 1;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), rect = canvas.getBoundingClientRect();
    cssW = Math.max(1, rect.width); cssH = Math.max(1, rect.height);
    cam.rect = { left: rect.left, top: rect.top, width: cssW, height: cssH };
    W = Math.round(cssW * dpr); Hh = Math.round(cssH * dpr);
    if (canvas.width !== W || canvas.height !== Hh) { canvas.width = W; canvas.height = Hh; }
    dirty = true;
  }
  addEventListener('resize', resize);
  resize();

  function render(p, t) {
    const E = env(p), C = camera(p, t, cssW, cssH);
    Object.assign(cam, { vp: C.vp, eye: C.eye, right: C.r, fwd: C.f, sun: E.dir });
    const g = geoOf(p), m = matOf(p), l = litOf(p);
    const skyRefl = mix(E.hzn, E.zen, 0.4);
    const fogS = C.D * 0.9, fogK = 1 / 55, pxW = 2 * Math.tan(C.fov / 2) / Hh;
    gl.viewport(0, 0, W, Hh);
    gl.clearColor(E.hzn[0], E.hzn[1], E.hzn[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const shared = (prog) => {
      prog.u('uRes', [W, Hh]); prog.u('uHzn', E.hzn); prog.u('uHznSun', E.sunH); prog.u('uZen', E.zen);
      prog.u('uSunDir', E.dir); prog.u('uSunCol', E.sun); prog.u('uSkyAmb', E.sky); prog.u('uGndAmb', E.gnd);
      prog.u('uEye', C.eye); prog.u('uGlow', E.glow); prog.u('uFogS', fogS); prog.u('uFogK', fogK); prog.u('uPxW', pxW);
    };
    // sky
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
    gl.useProgram(sky.p); shared(sky);
    sky.u('uR', C.r); sky.u('uU', C.u); sky.u('uF', C.f); sky.u('uMid', E.mid); sky.u('uMidSun', E.midSun);
    sky.u('uTan', [Math.tan(C.fov / 2) * C.aspect, Math.tan(C.fov / 2)]); sky.u('uStars', E.stars);
    attribs(sky, quadBuf, [['aQ', 2]], 8);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    // ground
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.useProgram(ground.p); shared(ground);
    ground.u('uVP', C.vp); ground.u('uSurvey', surveyR(p)); ground.u('uPave', paveR(p)); ground.u('uLit', l);
    ground.u('uParks', [PARKS[0][0], PARKS[0][1], PARKS[1][0], PARKS[1][1]]);
    attribs(ground, quadBuf, [['aQ', 2]], 8);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    // buildings, trees, the monument
    gl.useProgram(city.p); shared(city);
    city.u('uVP', C.vp); city.u('uGeo', g); city.u('uMat', m); city.u('uLit', l); city.u('uLamp', sm(cl(l / 0.5))); city.u('uSkyRefl', skyRefl);
    attribs(city, cityBuf, [['aPos', 3], ['aNrm', 3], ['aBox', 4], ['aDim', 4], ['aMat', 4], ['aClad', 3]], 84);
    gl.drawArrays(gl.TRIANGLES, 0, cityCount);
    // lights: additive, tested against the city but not writing depth
    if (l > 0) {
      let n = 0;
      const pt = (x, y, z, r, g2, b, s) => { dyn.set([x, y, z, -1, r, g2, b, s], n * 8); n++; };
      const carOn = sm(cl((l - 0.1) / 0.5));
      for (const c of cars) {
        const s = ((c.s + c.dir * c.v * t + L) % (2 * L) + 2 * L) % (2 * L) - L;
        const x = c.axis ? c.lane : s, z = c.axis ? s : c.lane;
        const k = carOn * sm(cl((L - Math.abs(s)) / 2.5));
        const toward = (c.axis ? (C.eye[2] - z) : (C.eye[0] - x)) * c.dir > 0;
        if (toward) pt(x, 0.08, z, 1.0 * k, 0.9 * k, 0.72 * k, 0.2); else pt(x, 0.08, z, 0.95 * k, 0.12 * k, 0.07 * k, 0.17);
      }
      const blink = Math.pow(0.5 + 0.5 * Math.sin(t * 2.6), 3) * sm(cl((l - 0.85) / 0.15));
      pt(tower.cx, tower.H + 0.05, tower.cz, blink, 0.12 * blink, 0.08 * blink, 0.5);
      const up = sm(cl((l - 0.05) / 0.3));
      for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) pt(monument.cx + sx * 0.46, 0.4, monument.cz + sz * 0.46, up, 0.75 * up, 0.45 * up, 0.24);
      gl.bindBuffer(gl.ARRAY_BUFFER, dynBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, dyn.subarray(0, n * 8));
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.depthMask(false);
      gl.useProgram(points.p);
      points.u('uVP', C.vp); points.u('uEyeP', C.eye); points.u('uPx', Hh / (2 * Math.tan(C.fov / 2)));
      points.u('uLitP', l); points.u('uFogSP', fogS); points.u('uFogKP', fogK);
      attribs(points, lampBuf, [['aP', 4], ['aC', 4]], 32);
      gl.drawArrays(gl.POINTS, 0, lamps.length / 8);
      attribs(points, dynBuf, [['aP', 4], ['aC', 4]], 32);
      gl.drawArrays(gl.POINTS, 0, n);
      gl.depthMask(true); gl.disable(gl.BLEND);
    }
  }

  let last = performance.now(), clock = 0, readySent = false;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!heard && !root.classList.contains('swarm-js')) build = 1;   // the engine never came: show the finished city
    if (!reduce) { clock += dt; dirty = true; }
    if (dirty) { render(build, clock); dirty = false; }
    if (!readySent) { readySent = true; swarm.ready(canvas); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
