name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax
        run: node --check skills/swarm-build/assets/swarm-build.js
      - name: Install the test tools (no package.json, the library has no dependencies)
        run: npm install --no-save --no-package-lock playwright@1 three@0.187.0 @babylonjs/core@8
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Projector and browser smoke tests
        run: node --test --test-concurrency=1 tests/*.test.mjs
